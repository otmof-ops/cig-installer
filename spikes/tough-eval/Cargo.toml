# An evaluation spike for docs/decisions/0004-signed-metadata.md. It is not a member of the
# installer's workspace: the empty [workspace] table below makes this package its own root, so
# `cargo build` here never touches the installer's lockfile or target directory, and the installer's
# `cargo metadata` never lists it. Nothing here ships.

[workspace]

[package]
name = "tough-eval"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "FSL-1.1-ALv2"
publish = false
description = "Exercises the tough TUF client against the attacks TUF stops (decision 0004)"

[lints.clippy]
# `tough::error::Error` is 224 bytes (it carries a backtrace) and `ureq::Error` is large too. The
# spike returns them unchanged so a test can match on them; the installer would map each to a
# small error of its own at the seam.
result_large_err = "allow"

[dependencies]
# No default features: no HTTP stack of tough's own. The installer would bring its own transport.
tough = { version = "0.24", default-features = false }
# The crypto crate tough already uses; here only to make throwaway test keys.
aws-lc-rs = "1"
tokio = { version = "1", default-features = false, features = ["rt"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
jiff = "0.2"
url = "2"
serde_json = "1"
# The installer's own HTTP client, configured as the workspace configures it.
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
tiny_http = "0.12"

# The installer's release profile, so the size comparison is like for like.
[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.dev.package.sha2]
opt-level = 3

[[bin]]
name = "baseline"
path = "src/bin/baseline.rs"

[[bin]]
name = "tuf-client"
path = "src/bin/tuf-client.rs"

[[bin]]
name = "tuf-file"
path = "src/bin/tuf-file.rs"
