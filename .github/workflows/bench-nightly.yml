name: bench-nightly

# The nightly family benchmark (#35, otmof-ops/cig-script#179 step 6): cig-script's reusable
# bench.yml runs bench/bench.toml on a schedule and appends one line per run to
# `history/ciginstaller.jsonl` on the `bench-history` branch, which `cig bench history` reads. A
# timing never fails it (timings are reported, never gated: cig-script#153); a wrong answer does.
# This repository is public, so the minutes cost nothing. The workflow waits on cig-script#197,
# which adds bench.yml. The installer's own budgets (bench/budgets.toml) stay in bench.yml, called
# by ci.yml on every pull request.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    uses: otmof-ops/cig-script/.github/workflows/bench.yml@main
    with:
      mode: nightly
      # The cig the suite is measured with, sha256 checked.
      cig-version: "1.21.0"
      # What the suite needs beside cig: this repository's `ciginstaller`,
      # which bench/bench.toml runs from target/release.
      prepare: |
        set -eu
        cargo build --release --locked -p ciginstaller
        echo "$PWD/target/release" >> "$GITHUB_PATH"
    permissions:
      contents: write
      pull-requests: write
