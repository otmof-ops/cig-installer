name: release

# A tag `vX.Y.Z` builds ciginstaller for Linux x86_64 and aarch64 (static, musl) and creates a
# DRAFT release: one tarball per machine holding ciginstaller, cigi-shim, LICENSE, NOTICE and
# THIRD-PARTY-NOTICES at the top level (manifest/tools.toml: strip = 0), a `.sha256` sidecar in
# sha256sum format and a build attestation for each, and the three licence files beside them.
# The bootstrap scripts install.sh and install.ps1 are filled in from their templates with this
# release's tarball digests, get a `.sha256` and an attestation too, and ride in the same draft.
# They prove integrity, not authorship: nothing is signed until signed metadata (#9) exists.
# Publishing the draft is the operator's act, after the licence gate. Nothing here publishes.
# The tag is made by the operator first; `gh release create --verify-tag` refuses a missing one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Row 7 of carton 0.2.0: the release reuses the tagged SHA's green CI instead of rebuilding and
  # retesting. This job reads the tag commit's own ci.yml run through the Actions API with the
  # workflow's own token, and fails with a clear message when none is green. Nothing publishes if
  # CI did not pass on this exact commit.
  ci-green:
    name: CI was green for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: read
    steps:
      - name: find and check the CI run for the tag's SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The tag's commit must have a green ci.yml run. A run still in progress is waited for
          # (a tag pushed straight after a merge), up to 90 minutes. Nothing publishes otherwise.
          deadline=$(( $(date +%s) + 5400 ))
          while :; do
            runs="$(gh api --paginate \
              "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
              --jq '.workflow_runs[] | [.id, .status, .conclusion, .event, .html_url] | @tsv')"
            printf 'ci.yml runs for %s:\n%s\n' "$SHA" "${runs:-none yet}"
            if printf '%s\n' "$runs" | awk -F '\t' '$2 == "completed" && $3 == "success" { print "green run:", $5; found = 1 } END { exit found ? 0 : 1 }'; then
              echo "ci.yml is green for $SHA"
              exit 0
            fi
            if [ -n "$runs" ] && ! printf '%s\n' "$runs" | awk -F '\t' '$2 != "completed" { live = 1 } END { exit live ? 0 : 1 }'; then
              echo "::error::ci.yml finished on $SHA without a success: get it green on main, then tag that commit"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::no green ci.yml run for $SHA after 90 minutes: let CI finish, then rerun this workflow"
              exit 1
            fi
            echo "waiting for ci.yml on $SHA"
            sleep 60
          done

  build:
    name: build (${{ matrix.asset }})
    needs: ci-green
    runs-on: ${{ matrix.os }}
    # This job compiles dependencies' build scripts: it holds no token beyond reading the code.
    # The attestation is signed in its own job, below, which runs nothing it downloads.
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  asset: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: linux-aarch64 }
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: the tag matches the workspace version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          have="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          if [[ "$ver" != "$have" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $have"
            exit 1
          fi
      - name: Install Rust (stable) and the musl toolchain
        run: |
          # Canonical's names can stop resolving for hours (2026-11-11: the runner's mirror list and
          # archive.ubuntu.com alike, while public resolvers still answered). Each try is time-bound; after
          # a failed one apt goes to the main archive, and a name this runner cannot resolve is pinned in
          # /etc/hosts from DNS over HTTPS to 1.1.1.1, which needs no lookup. apt still checks signatures.
          for i in 1 2 3 4; do
            if timeout 300 sudo apt-get -o Acquire::Retries=3 update \
              && timeout 300 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends musl-tools; then
              break
            fi
            if [ "$i" -eq 4 ]; then exit 1; fi
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              if [ -f "$f" ] && grep -q 'mirror+file:' "$f"; then
                sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' "$f"
                echo "apt: $f now uses archive.ubuntu.com"
              fi
            done
            for h in archive.ubuntu.com security.ubuntu.com; do
              if ! getent hosts "$h" >/dev/null; then
                ip=$(curl -fsS --max-time 10 -H 'accept: application/dns-json' "https://1.1.1.1/dns-query?name=$h&type=A" \
                  | jq -r '[.Answer[]? | select(.type == 1) | .data][0] // empty' || true)
                if [ -n "$ip" ]; then
                  echo "$ip $h" | sudo tee -a /etc/hosts >/dev/null
                  echo "apt: $h pinned to $ip"
                fi
              fi
            done
            sleep $((i * 15))
          done
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: cargo build --release
        run: cargo build --release --locked -p ciginstaller -p cigi-shim --target ${{ matrix.target }}
      - name: size budget
        run: ci/size-check.sh target/${{ matrix.target }}/release
      - name: package, unpack, run
        run: |
          ver="${GITHUB_REF_NAME#v}"
          name="ciginstaller-v${ver}-${{ matrix.asset }}.tar.gz"
          rel="target/${{ matrix.target }}/release"
          mkdir -p stage out
          cp "$rel/ciginstaller" "$rel/cigi-shim" LICENSE NOTICE stage/
          cp THIRD-PARTY-NOTICES.md stage/THIRD-PARTY-NOTICES
          # files at the top of the archive (strip 0); fixed owner, order and times, so a rebuild matches
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@$(git log -1 --format=%ct)" -C stage -cf - . | gzip -n > "out/$name"
          (cd out && sha256sum "$name" > "$name.sha256" && cat "$name.sha256" && sha256sum -c "$name.sha256")
          tar -tzf "out/$name"
          # the archive must hold exactly these five files
          [[ "$(tar -tzf "out/$name" | sed 's|^\./||' | grep -v '^$' | sort | tr '\n' ' ')" == "LICENSE NOTICE THIRD-PARTY-NOTICES cigi-shim ciginstaller " ]] \
            || { echo "::error::the tarball does not hold the five expected files"; exit 1; }
          check="$(mktemp -d)"
          tar -xzf "out/$name" -C "$check"
          "$check/ciginstaller" --version | tee /dev/stderr | grep -q "$ver"
      - uses: actions/upload-artifact@v4
        with:
          name: ciginstaller-${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  # The bootstrap scripts: the templates in packaging/bootstrap with this release's digests written
  # in. It reads the tarballs' .sha256 sidecars as data (each is checked to be exactly a sha256sum
  # line) and runs only the repository's own fill and test scripts, never anything it downloaded.
  bootstrap:
    name: fill the bootstrap scripts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: fill install.sh and install.ps1
        run: ci/fill-bootstrap.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" assets bootstrap-out
      - name: shellcheck and the bootstrap tests
        run: |
          shellcheck -s sh packaging/bootstrap/install.sh.in bootstrap-out/install.sh
          shellcheck ci/fill-bootstrap.sh ci/test-bootstrap.sh
          ci/test-bootstrap.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap
          path: bootstrap-out/*
          if-no-files-found: error

  # The attestation, apart from the build: this job holds the signing token and runs nothing it
  # downloaded, only the attestation action over the tarballs' bytes.
  attest:
    name: attest the builds
    needs: [build, bootstrap]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: attest the build (the installer's self update checks this with gh attestation verify)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            assets/ciginstaller-v*-linux-*.tar.gz
            assets/install.sh
            assets/install.ps1

  # One job writes every asset, so no two jobs ever write one release at once.
  draft:
    name: draft release
    needs: [build, bootstrap, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: THIRD-PARTY-NOTICES.md is current
        run: python3 ci/gen-third-party.py --check
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l assets
          # shellcheck disable=SC2012
          [[ "$(ls assets/*.tar.gz | wc -l)" == 2 ]] || { echo "::error::expected two tarballs"; exit 1; }
          for f in install.sh install.sh.sha256 install.ps1 install.ps1.sha256; do
            [[ -s "assets/$f" ]] || { echo "::error::assets/$f is missing"; exit 1; }
          done
          (cd assets && sha256sum -c install.sh.sha256 install.ps1.sha256)
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "ciginstaller $GITHUB_REF_NAME" \
            --notes "ciginstaller $GITHUB_REF_NAME for Linux x86_64 and aarch64 (static). Each tarball has a .sha256 sidecar and a build attestation: gh attestation verify <tarball> -R $GITHUB_REPOSITORY. install.sh and install.ps1 carry this release's digests; download one, read it, then run it. They prove integrity, not authorship: nothing is signed yet." \
            assets/*.tar.gz assets/*.tar.gz.sha256 \
            assets/install.sh assets/install.sh.sha256 assets/install.ps1 assets/install.ps1.sha256 \
            LICENSE NOTICE THIRD-PARTY-NOTICES.md
          echo "draft created; publishing it is the operator's act" >> "$GITHUB_STEP_SUMMARY"
