remedy = "`ciginstaller config set mirror https://<your mirror>/`, or `ciginstaller config unset mirror`; `ciginstaller doctor` lists it"
[[code.cause]]
why = "the mirror is plain http on this machine and the build it served is not one a pin vouches for"
probe = "none"
remedy = "serve the mirror over https, or use a `file://` mirror or a bundle (`ciginstaller install carton --from <bundle>`)"
[[code.cause]]
why = "a server answered an https request by sending it on to plain http"
probe = "none"
remedy = "ask the mirror's operator to serve https only; nothing here can be told to follow it"
