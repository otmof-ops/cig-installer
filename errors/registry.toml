tags = ["installer", "ci-likely"]
since = "0.1.0"
related = ["E1821"]
[[code.cause]]
why = "the archive was tampered with, or is not one of ours"
no = "these-are-mine"
probe = "none"
remedy = "do not extract it by hand; report it at https://github.com/otmof-ops/cig-installer/issues"

[[code]]
code = "E1827"
title = "sidecar missing or disagrees"
meaning = "The .sha256 file beside an asset is missing, or it names a different digest than the asset or the manifest."
fix = "`ciginstaller install carton`, to fetch both again"
no = "never-heard-of-you"
arises = ["any"]
tags = ["installer", "ci-likely"]
since = "0.1.0"
related = ["E1821", "E1822"]
[[code.cause]]
why = "the release has no .sha256 asset for this file"
