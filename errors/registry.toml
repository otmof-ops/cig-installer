[[code]]
code = "E1857"
title = "a crash report did not leave this machine"
meaning = "`ciginstaller crash send` (or `crash submit --now`) did not send a report: the `reports` setting is `never`, no route can file it, or the route did not take it. `crash test-route` answers with this code when no route can file a report. Nothing was lost: the report stays in the ashtray with the reason, and `ciginstaller crash show` still prints exactly what would be sent."
fix = "`ciginstaller crash show <report>`, then `ciginstaller crash send <report>` once the cause is gone"
no = "depends"
arises = ["crash"]
tags = ["installer", "ci-likely"]
since = "0.1.0"
related = ["E1890", "E1870"]
[[code.cause]]
why = "`reports` is `never` (`CIG_REPORTS`, `CIGI_REPORTS` or `ciginstaller config set reports never`), so nothing is sent, not even a report you name"
no = "these-are-mine"
probe = "none"
remedy = "`ciginstaller config set reports ask` (and unset `CIG_REPORTS` if it is set), then send the report again"
[[code.cause]]
why = "the route named by `CIGI_REPORT_ROUTE` is not an https address (plain http is allowed to a loopback address only), or carries a query string, a fragment or credentials"
no = "cant-see-any"
probe = "none"
remedy = "set it to the route's plain `https://` address"
[[code.cause]]
why = "the route could not be reached, or answered with an error or a redirect (a report goes only where it was told to, so a redirect is not followed)"
no = "depends"
probe = "none"
remedy = "check the connection and send again; the report waits in the ashtray and its last error is in `ciginstaller crash list`"
[[code.cause]]
why = "no route could file it: `gh` is missing or not logged in, `CIG_GITHUB_TOKEN` is unset or refused, the token lacks the issues scope, GitHub answered 422 to the search, or a rate limit is in force (the next try is recorded)"
no = "depends"
probe = "none"
remedy = "`ciginstaller crash test-route` names each route's reason with GitHub's own error text; fix the route you use (`gh auth login`, or a token with the issues scope), or file it by hand with `ciginstaller crash send <report> --via link`"
[[code.cause]]
why = "the network is down, DNS is failing, or GitHub redirected to another host (the token is never sent to another host)"
no = "cant-see-any"
probe = "none"
remedy = "check the connection and send again; the report waits in the ashtray, and `ciginstaller crash send <report> --via file --out <file>` writes it out to file from another machine"

[[code]]
code = "E1858"
title = "a report could not be put together"
meaning = "`ciginstaller report` or `ciginstaller bug` could not build or write the report: cig, which alone can read its own run records, did not give a bundle for the run (it could not be run, or it failed), the file asked for with `--out` could not be written, or the bug report could not be saved in the ashtray. Nothing was sent and nothing on the machine changed; `ciginstaller report --block` still prints the version block."
fix = "`ciginstaller report --block`, then `ciginstaller report <run> --out <file>` once the cause is gone"
no = "depends"
arises = ["crash"]
tags = ["installer"]
since = "0.1.0"
related = ["E1857", "E1870", "E1831"]
[[code.cause]]
why = "cig is installed but its files differ from its receipt, or it has no readable receipt, so it is not run to build a bundle"
no = "these-are-mine"
probe = "none"
remedy = "`ciginstaller repair`, then ask for the report again"
[[code.cause]]
why = "cig started and did not answer with a bundle (a run record it cannot read, a cig that is too old to build one, or a timeout)"
no = "depends"
probe = "none"
remedy = "`ciginstaller report <run> --out <file>` again, or `cig report <run>` by hand until cig has `report-bundle`; `ciginstaller report --block` needs no cig"
[[code.cause]]
why = "the file given to `--out` is in a folder that cannot be written"
no = "these-are-mine"
probe = "none"
remedy = "give `--out` a path you can write"
[[code.cause]]
why = "`ciginstaller bug` could not put the report together: cig did not give the bundle of the run it was asked about (the cause above), or the report could not be saved because the ashtray's folder cannot be written"
no = "depends"
probe = "none"
remedy = "`ciginstaller bug --run <id>` again once cig answers (`ciginstaller repair` if its files differ from the receipt), or `ciginstaller bug --product <part>` for a report that is not about a run; make `ashtray/` in the home writable"

[[code]]
code = "E1859"
title = "a program could not be rebuilt"
meaning = "`ciginstaller programs rebuild` did not replace the program: its script is not on this machine, the carton's cig or cigcompile is missing or differs from its receipt, the installed cig is itself covered by the advisory, cigcompile's build, `cigcompile verify` or the program's own `cigcompile test` failed, or the file could not be written. The program was not touched: it is replaced only after the rebuilt one has passed both checks, in one transaction that puts the old one back on any failure."
fix = "`ciginstaller programs rebuild <name> --script <the script's path>`, or `ciginstaller doctor`"
no = "depends"
arises = ["any"]
tags = ["installer"]
since = "0.1.0"
related = ["E1805", "E1858", "E1831", "E1870"]
[[code.cause]]
