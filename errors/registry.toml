no = "these-are-mine"
probe = "none"
remedy = "`ciginstaller programs rebuild <name> --script <path>`; when it is gone, the advisory (`ciginstaller programs`) names what its author needs to rebuild it with"
[[code.cause]]
why = "cig or cigcompile is not installed, or its files differ from its receipt, so it is not run"
no = "these-are-mine"
probe = "none"
remedy = "`ciginstaller repair`, or `ciginstaller install carton`"
[[code.cause]]
why = "the installed cig is covered by the same advisory as the program, so a rebuild on it would not fix it"
no = "these-are-mine"
probe = "none"
remedy = "`ciginstaller update`, then rebuild"
[[code.cause]]
why = "cigcompile's build, `cigcompile verify` or `cigcompile test` failed or ran past its time limit (the message carries what it said)"
no = "depends"
probe = "none"
remedy = "read what cigcompile said; `cigcompile test <script>` by hand shows the same difference, and the old program is still in place"
[[code.cause]]
why = "the program's file or its folder cannot be written, or the program is setuid or setgid (a program never runs with raised rights, so it is not replaced)"
no = "these-are-mine"
probe = "none"
remedy = "make the folder writable, or give the person who owns it the rebuilt program: `ciginstaller programs rebuild <name> --dry-run` says what would be built"

