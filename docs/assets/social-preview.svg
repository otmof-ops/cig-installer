<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="cig-installer: the CigScript family, one carton at a time. Install, pin, update, repair and remove, verified, as one undoable step.">
  <title>cig-installer</title>
  <defs>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="45%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="paper-up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>
  <style>
    .word { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 66px; font-weight: 700; letter-spacing: -2px; }
    .tag { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 31px; fill: #d1d5db; }
    .sub { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 24px; fill: #9ca3af; }
    .chip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 20px; fill: #9ca3af; }
  </style>
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="8" fill="#f97316"/>
  <!-- the mark, scaled up from the logo -->
  <g transform="translate(60 118) scale(1.7)">
    <g stroke="#d1d5db" stroke-width="1.2">
      <rect x="30" y="44" width="16" height="40" rx="3" fill="url(#paper-up)"/>
      <rect x="50" y="30" width="16" height="54" rx="3" fill="url(#paper-up)"/>
      <rect x="70" y="40" width="16" height="44" rx="3" fill="url(#paper-up)"/>
      <rect x="90" y="52" width="16" height="32" rx="3" fill="url(#paper-up)"/>
    </g>
    <g fill="#d6b370">
      <rect x="30" y="28" width="16" height="20" rx="4"/>
      <rect x="50" y="14" width="16" height="20" rx="4"/>
      <rect x="70" y="24" width="16" height="20" rx="4"/>
      <rect x="90" y="36" width="16" height="20" rx="4"/>
    </g>
    <g fill="#c8a25f" opacity="0.6">
      <rect x="32" y="33" width="12" height="3"/><rect x="32" y="41" width="12" height="3"/>
      <rect x="52" y="19" width="12" height="3"/><rect x="52" y="27" width="12" height="3"/>
      <rect x="72" y="29" width="12" height="3"/><rect x="72" y="37" width="12" height="3"/>
      <rect x="92" y="41" width="12" height="3"/><rect x="92" y="49" width="12" height="3"/>
    </g>
    <rect x="20" y="66" width="96" height="62" rx="8" fill="url(#paper)" stroke="#d1d5db" stroke-width="1.5"/>
    <rect x="20" y="66" width="96" height="7" rx="3" fill="#d1d5db" opacity="0.7"/>
    <rect x="20" y="92" width="96" height="14" fill="#f97316" opacity="0.9"/>
    <rect x="20" y="112" width="96" height="2" fill="#d1d5db"/>
    <rect x="128" y="92" width="28" height="20" rx="5" fill="#d6b370"/>
    <rect x="131" y="96" width="22" height="3" fill="#c8a25f" opacity="0.6"/>
    <rect x="131" y="105" width="22" height="3" fill="#c8a25f" opacity="0.6"/>
    <rect x="154" y="92" width="62" height="20" rx="5" fill="url(#paper)" stroke="#d1d5db" stroke-width="1.5"/>
    <circle cx="218" cy="102" r="17" fill="#f97316" opacity="0.14"/>
    <circle cx="218" cy="102" r="11" fill="url(#ember)"/>
    <g fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
      <path d="M 218 84 C 208 74, 230 66, 218 56"/>
      <path d="M 226 82 C 238 72, 216 66, 228 52"/>
      <path d="M 210 86 C 200 78, 212 70, 206 60"/>
    </g>
  </g>
  <text x="530" y="232" class="word" fill="#9ca3af">cig-<tspan fill="#f97316">installer</tspan></text>
  <text x="534" y="284" class="sub">a CigScript tool</text>
  <text x="120" y="440" class="tag">The CigScript family, one carton at a time: verified, and undoable</text>
  <!-- what it does -->
  <rect x="120" y="498" width="102" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="171" y="523" text-anchor="middle" class="chip">install</text>
  <rect x="234" y="498" width="72" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="270" y="523" text-anchor="middle" class="chip">pin</text>
  <rect x="318" y="498" width="108" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="372" y="523" text-anchor="middle" class="chip">update</text>
  <rect x="438" y="498" width="132" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="504" y="523" text-anchor="middle" class="chip">rollback</text>
</svg>
