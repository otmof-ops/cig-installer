<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="cig-installer: install, pin, update and remove the CigScript family, one carton at a time. A CigScript tool.">
  <title>cig-installer</title>
  <defs>
    <linearGradient id="paper-up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="carton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6b370"/>
      <stop offset="100%" stop-color="#c8a25f"/>
    </linearGradient>
  </defs>
  <style>
    .word { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 66px; font-weight: 700; letter-spacing: -2px; }
    .tag { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 31px; fill: #d1d5db; }
    .sub { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 24px; fill: #9ca3af; }
    .chip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 20px; fill: #9ca3af; }
  </style>
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="8" fill="#f97316"/>
  <g transform="translate(70 104) scale(2)">
  <!-- a carton, open: packs standing in it, one lifted part-way out, nothing lit -->
  <g>
    <!-- packs behind the front wall: only their tops show -->
    <g>
    <rect x="30" y="54" width="24" height="18" rx="4" fill="url(#paper-up)" stroke="#d1d5db" stroke-width="1.2"/>
    <rect x="30" y="63" width="24" height="2.5" fill="#d1d5db"/>
    <rect x="30" y="70" width="24" height="3" fill="#f97316" opacity="0.9"/>
    <rect x="58" y="46" width="24" height="26" rx="4" fill="url(#paper-up)" stroke="#d1d5db" stroke-width="1.2"/>
    <rect x="58" y="55" width="24" height="2.5" fill="#d1d5db"/>
    <rect x="58" y="62" width="24" height="3" fill="#f97316" opacity="0.9"/>
    <rect x="86" y="58" width="24" height="14" rx="4" fill="url(#paper-up)" stroke="#d1d5db" stroke-width="1.2"/>
    <rect x="86" y="67" width="24" height="2.5" fill="#d1d5db"/>
    <rect x="86" y="74" width="24" height="3" fill="#f97316" opacity="0.9"/>
    </g>
    <!-- the lifted pack, with its filters showing -->
    <g>
      <rect x="116" y="16" width="24" height="3" fill="none"/>
    <rect x="114" y="28" width="24" height="44" rx="4" fill="url(#paper-up)" stroke="#d1d5db" stroke-width="1.2"/>
    <rect x="114" y="37" width="24" height="2.5" fill="#d1d5db"/>
    <rect x="114" y="44" width="24" height="3" fill="#f97316" opacity="0.9"/>
      <rect x="118" y="22" width="6" height="8" rx="2" fill="#d6b370"/>
      <rect x="127" y="22" width="6" height="8" rx="2" fill="#d6b370"/>
    </g>
    <!-- carton: front wall, rim, band -->
    <rect x="18" y="70" width="136" height="58" rx="5" fill="url(#carton)"/>
    <rect x="18" y="70" width="136" height="9" rx="3" fill="#d6b370" stroke="#f3f4f6" stroke-width="1" stroke-opacity="0.6"/>
    <rect x="18" y="98" width="136" height="12" fill="#f97316" opacity="0.9"/>
    <rect x="18" y="116" width="136" height="2" fill="#c8a25f" opacity="0.0"/>
  </g>
  </g>
  <text x="440" y="232" class="word" fill="#9ca3af">cig-<tspan fill="#f97316">installer</tspan></text>
  <text x="444" y="286" class="tag">Install, pin, update and remove the</text>
  <text x="444" y="326" class="tag">CigScript family, one carton at a time</text>
  <text x="444" y="378" class="sub">a CigScript tool: a carton holds packs, a pack holds sticks</text>
  <text x="120" y="470" class="sub">the commands you meet first</text>
  <rect x="120" y="498" width="120" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="180.0" y="523" text-anchor="middle" class="chip">install</text><rect x="252" y="498" width="72" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="288.0" y="523" text-anchor="middle" class="chip">pin</text><rect x="336" y="498" width="108" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="390.0" y="523" text-anchor="middle" class="chip">update</text><rect x="456" y="498" width="132" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="522.0" y="523" text-anchor="middle" class="chip">rollback</text><rect x="600" y="498" width="108" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="654.0" y="523" text-anchor="middle" class="chip">doctor</text><rect x="720" y="498" width="108" height="38" rx="19" fill="none" stroke="#30363d" stroke-width="2"/><text x="774.0" y="523" text-anchor="middle" class="chip">remove</text>
</svg>
