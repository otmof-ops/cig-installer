[workspace]
resolver = "2"
members = [
    "crates/cig-compat",
    "crates/cigi-home",
    "crates/cigi-source",
    "crates/cigi-ui",
    "crates/cigi-shim",
    "crates/ciginstaller",
    "crates/cigi-budgets",
    "crates/cigi-testkit",
    "crates/cigi-sys",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "FSL-1.1-ALv2"
repository = "https://github.com/otmof-ops/cig-installer"
publish = false

[workspace.dependencies]
cigi-sys = { path = "crates/cigi-sys" }
windows-sys = { version = "0.61", default-features = false }
sha2 = "0.10"
hex = "0.4"
url = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
# The TLS roots: the system's store (which honors SSL_CERT_FILE and SSL_CERT_DIR), and the
# bundled Mozilla roots only when the system has none (#48).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.7"
webpki-roots = "0.26"
# The fixture server's throwaway loopback certificate (tests only).
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
tar = "0.4"
flate2 = "1"
tempfile = "3"
tiny_http = "0.12"
cig-compat = { path = "crates/cig-compat" }
cigi-home = { path = "crates/cigi-home" }
cigi-source = { path = "crates/cigi-source" }
cigi-testkit = { path = "crates/cigi-testkit" }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"

# The shim is built for size (SPEC section 9).
[profile.release.package.cigi-shim]
opt-level = "s"
strip = "symbols"

# Hashing a debug build of the installer at install time is slow unoptimised.
[profile.dev.package.sha2]
opt-level = 3
