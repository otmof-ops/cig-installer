[carton."0.1.0"]
released     = 2026-11-12
notes        = "first carton: cig, cigo, cigcompile"
tested       = []
cig          = "1.20.0"
cigo         = "1.17.0"
cigcompile   = "0.2.0"
ciginstaller = "0.1.0"
[carton."0.1.0".packs]
dev     = [ "cig", "cigo" ]
builder = [ "cig", "cigo", "cigcompile" ]

[product.cigo."1.17.0"]
requires = { cig = ">=1.16.1, <2" }
[product.cigcompile."0.2.0"]
requires = { }
embeds   = { cig_runtime = "1.18.0", journal_format = 3 }
os_min   = { linux = "kernel 3.10", windows = "10" }

[yanked]
