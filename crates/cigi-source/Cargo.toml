[package]
name = "cigi-source"
description = "Where bytes come from and whether to believe them: sources, trust, downloads, safe archive extraction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cig-compat = { workspace = true }
cigi-home = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
ureq = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
webpki-roots = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
tough = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[features]
# The TUF client (#9). Off until the installer's size budget for it is decided: tough brings
# aws-lc-rs and tokio (about +5 MB). xtask turns it on to sign and to run the attack tests.
tuf = ["dep:tough", "dep:tokio", "dep:futures"]

[dev-dependencies]
cigi-testkit = { workspace = true }
tempfile = { workspace = true }
