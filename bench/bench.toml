#
# The installer's suite for `cig bench` (cig-installer#35, cig-script#179): the budgets of
# #32 that a command's own time answers, in the family tool's format, so that
# `cig bench --family` reads it next to cig's, cigo's and cigcompile's. Run it from the
# repository root:
#
#   cargo build --release -p ciginstaller && cig bench
#   cig bench --timings          where each case's time went: start, home, command, output
#
# `ciginstaller bench` (a different thing) measures the budgets in bench/budgets.toml, which the
# binary embeds. A case runs in a scratch home (`home = "isolated"`), so a user's installed
# cartons, pins and settings are never read.
#
# Not in this file yet, because each needs an installed carton, a mirror or another product's
# build that a scratch home does not have: cigo's hook on each cig in a carton, a compiled
# program against `cig run`, `update --check` and `which --why`, an update's trial on a 50-script
# project, the window's timings, a carton's install from a local mirror. `cig bench --family
# --matrix` and `--with` swap the products these compare.

format = 1

[bench]
product = "ciginstaller"
version = ["ciginstaller", "--version"]
home    = "isolated"
build   = ["cargo", "build", "--release", "-p", "ciginstaller"]
binary  = "target/release/ciginstaller"
watch   = ["crates/**", "bench/**", "Cargo.toml"]

[defaults]
samples = 9
per     = 10
warmup  = 1
env     = { NO_COLOR = "1", CIGI_NO_UPDATE_CHECK = "1" }

[[case]]
name   = "version"
group  = "start-up"
run    = ["ciginstaller", "--version"]
expect = { exit = 0 }

[[case]]
name   = "status, nothing installed"
group  = "start-up"
run    = ["ciginstaller", "status"]
expect = { exit = 0, stdout = "fixtures/status.expect" }

[[case]]
name   = "list, nothing installed"
group  = "start-up"
run    = ["ciginstaller", "list"]
expect = { exit = 0, stdout = "fixtures/list.expect" }
