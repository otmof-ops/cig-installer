# REUSE specification (https://reuse.software). One license per path.
version = 1
SPDX-PackageName = "cig-installer"
SPDX-PackageSupplier = "Jay Taylor"
SPDX-PackageDownloadLocation = "https://github.com/otmof-ops/cig-installer"

[[annotations]]
path = ["src/**", "crates/**", "tests/**", "bench/**", "ci/**", "packaging/**", "xtask/**", "spikes/**", "manifest/*.toml", ".cargo/**", "errors/**", "build.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".github/**", ".gitignore", "REUSE.toml"]
